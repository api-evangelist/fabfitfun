name: FabFitFun
description: >-
  FabFitFun is a members-only lifestyle subscription company that delivers curated seasonal boxes of
  full-size beauty, fashion, wellness, and home products from premium brands, plus a members' community,
  customization, and weekly flash-sale shopping. Founded in Los Angeles and backed by 500 Global, Bond
  Capital, and Kleiner Perkins, FabFitFun serves over one million members with seasonal boxes valued up to
  $350 for as low as $65 per season. The company operates a direct-to-consumer commerce website, a members'
  account and box-customization experience, a support/help center, and the FabFitFun Magazine content
  property. As of this profile FabFitFun publishes no public developer portal, API documentation, or
  API reference; this entry captures its public web and legal surface plus a probed domain-security
  posture, and remains a portfolio-sourced lead for further enrichment.
